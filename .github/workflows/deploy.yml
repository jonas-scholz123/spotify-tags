name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # Without the client ID the build only contains the setup screen.
      - name: Require the Spotify client ID
        if: vars.VITE_SPOTIFY_CLIENT_ID == ''
        run: |
          echo "::error::Set the VITE_SPOTIFY_CLIENT_ID repository variable (Settings > Secrets and variables > Actions > Variables)."
          exit 1
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_SPOTIFY_CLIENT_ID: ${{ vars.VITE_SPOTIFY_CLIENT_ID }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5
